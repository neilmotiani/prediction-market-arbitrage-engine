[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prediction-market-arbitrage-engine"
version = "0.1.0"
description = "Depth-aware prediction market research and paper execution"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1", "numpy>=2.2,<3", "pandas>=2.2,<3", "python-dateutil>=2.9,<3"
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "pytest-cov>=6,<7", "ruff>=0.11,<1"]
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

# Separate persistent ledger: the mock postgres-data volume remains untouched.
services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_DB: arbitrage_live
    volumes:
      - postgres-live-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d arbitrage_live"]
  backend:
    restart: unless-stopped
    environment:
      MODE: live
      DATABASE_URL: postgresql+asyncpg://research:research@db:5432/arbitrage_live
      LIVE_AUTO_DISCOVER: "true"
      LIVE_MARKET_LIMIT: ${LIVE_MARKET_LIMIT:-60}
      LIVE_DISCOVERY_PAGES: ${LIVE_DISCOVERY_PAGES:-5}
      LIVE_EVENT_MARKET_LIMIT: ${LIVE_EVENT_MARKET_LIMIT:-2}
      LIVE_REFRESH_INTERVAL: ${LIVE_REFRESH_INTERVAL:-0.5}
      POLYMARKET_WEBSOCKET: "true"
      SIZING_POLICY: profit
      AUTO_PAPER_TRADE: "true"
      POLYMARKET_TOKEN_PAIRS: "[]"
      KALSHI_TICKERS: "[]"
  frontend:
    restart: unless-stopped
volumes:
  postgres-live-data:
